[tool.poetry]
name = "automatic-diary"
version = "0.5.1"
description = "Create one timeline from various digital sources discribing your life."
authors = ["Jakub Valenta <jakub@jakubvalenta.cz>"]
license = "GPLv3+"
readme = "README.md"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Utilities",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14"
]

[tool.poetry.dependencies]
Jinja2 = "^3.1.6"
beautifulsoup4 = "^4.14.3"
caldav = "^2.2.6"
dateparser = "^1.3.0"
ics = {git = "https://github.com/ics-py/ics-py.git", branch = "main"}
lxml = "^6.0.2"
more-itertools = "^10.8.0"
orgparse = "^0.4.20251020"
pystache = "^0.6.8"
python = "^3.10"
python-dateutil = "^2.9.0.post0"
requests = "^2.33.0"
"trakt.py" = "^4.4.0"
tzlocal = "^5.3.1"

[tool.poetry.scripts]
automatic-diary = "automatic_diary.cli:main"
automatic-diary-visualize = "automatic_diary.visualize:main"

[tool.poetry.group.dev.dependencies]
ddt = "^1.7.2"
isort = "^7.0.0"
mypy = "^1.19.1"
types-requests = "^2.32.4.20260107"
types-python-dateutil = "^2.9.0.20260124"
types-dateparser = "^1.3.0.20260210"
flake8-pyproject = "^1.2.4"
flake8-pydocstyle = "^0.2.5"
flake8-pytest-style = "^2.2.0"
pytest = "^9.0.2"

[tool.flake8]
extend-ignore = ["D100", "D101", "D102", "D103", "D104", "D105", "D107", "PT009"]
max-line-length = 100

[tool.isort]
profile = "django"
line_length = 100

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
